name: weather-aware-truck-routing

x-backend: &backend
  image: 'weather_aware_truck_routing_backend:latest'
  build:
    context: web
    dockerfile: Dockerfile
  volumes:
    - './web:/app'
  env_file: .env
  environment:
    RUN_MIGRATE: 'false'
  restart: always

services:
  # One-shot service: applies migrations once; the other services wait for it to finish.
  migrate:
    <<: *backend
    container_name: weather_aware_truck_routing_migrate
    restart: 'no'
    environment:
      RUN_MIGRATE: 'true'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: 'true'

  web:
    <<: *backend
    container_name: weather_aware_truck_routing_backend
    expose:
      - '8000'
    ports:
      - '8000:8000'
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: 'python manage.py runserver 0:8000'
    # For production: gunicorn weather_aware_truck_routing.wsgi:application --bind 0.0.0.0:8000 --workers 4

  worker:
    <<: *backend
    container_name: weather_aware_truck_routing_worker
    command: celery -A weather_aware_truck_routing worker --loglevel=info --concurrency=4
    depends_on:
      migrate:
        condition: service_completed_successfully

  beat:
    <<: *backend
    container_name: weather_aware_truck_routing_beat
    command: celery -A weather_aware_truck_routing beat --loglevel=info --schedule /tmp/celerybeat-schedule
    depends_on:
      migrate:
        condition: service_completed_successfully

  flower:
    image: mher/flower
    container_name: weather_aware_truck_routing_flower
    restart: always
    environment:
      - CELERY_BROKER_URL=${CELERY_BROKER_URL}
      - FLOWER_PORT=8888
      - FLOWER_BASIC_AUTH=${FLOWER_BASIC_AUTH_USERNAME}:${FLOWER_BASIC_AUTH_PASSWORD}
      - FLOWER_URL_PREFIX=flower
    expose:
      - '8888'
    depends_on:
      redis:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    container_name: weather_aware_truck_routing_nginx
    restart: always
    env_file: .env
    command: >-
      /bin/sh -c "envsubst '$$FORWARDED_PROTO' < /etc/nginx/nginx.conf.template > /etc/nginx/nginx.conf
      && nginx -g 'daemon off;'"
    ports:
      - '${NGINX_PORT:-8080}:80'
    volumes:
      - './web/static:/www/static:ro'
      - './web/profile_images:/www/profile_images:ro'
      - './config/nginx/nginx.conf:/etc/nginx/nginx.conf.template:ro'
    depends_on:
      - web
      - flower

  postgres:
    image: 'postgres:17'
    container_name: weather_aware_truck_routing_postgres
    restart: always
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USERNAME}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    command:
      - postgres
      - '-c'
      - shared_preload_libraries=pg_stat_statements
      - '-c'
      - pg_stat_statements.track=all
    ports:
      - '${POSTGRES_PORT:-5450}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    build:
      context: ./config/redis
      dockerfile: Dockerfile
    container_name: weather_aware_truck_routing_redis
    restart: always
    expose:
      - '6379'
    volumes:
      - redis_data:/data
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  postgres_data:
  redis_data:
